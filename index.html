<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Álbum 2026">
<meta name="theme-color" content="#080818">
<title>Panini FIFA World Cup 2026™</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none;transition:background .25s,color .25s}
:root{--bg:#080818;--bg2:#0d0d1a;--bg3:#1a1a2e;--bg4:#04040f;--border:#2a2a3e;--border2:#1e1e3a;--text:#eee;--text2:#ccc;--text3:#888;--text4:#555;--gold:#ffd700;--green:#4CAF50;--red:#e57373;--blue:#88ccff}
.light{--bg:#f0f2f5;--bg2:#ffffff;--bg3:#eaecf4;--bg4:#ffffff;--border:#cfd4e0;--border2:#b8c0d0;--text:#111;--text2:#333;--text3:#666;--text4:#999;--gold:#b8860b;--green:#2e7d32;--red:#c62828;--blue:#1565c0}
input::placeholder{color:var(--text4)}
button{font-family:inherit}
::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}
@media(max-width:600px){.grid{grid-template-columns:repeat(4,1fr);gap:4px;padding:6px}}
@media(max-width:360px){.grid{grid-template-columns:repeat(3,1fr);gap:3px;padding:4px}}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform 0.1s,border-color 0.15s;min-height:118px;position:relative;user-select:none}
@media(max-width:600px){.card{padding:6px 3px;min-height:100px;gap:3px}}
@media(max-width:360px){.card{padding:5px 2px;min-height:90px;gap:2px}}
.card:active{transform:scale(0.96)}
.card.tenho{background:#0a2e0a;border-color:#2d7a2d}
.light .card.tenho{background:#e8f5e9;border-color:#2e7d32}
.card.troca{background:#0a2e0a;border-color:#2d7a2d}
.light .card.troca{background:#e8f5e9;border-color:#2e7d32}
.card.foil{border-color:#b8860b}
.card.tenho.foil{border-color:#4caf50}
.card-img{width:80px;height:80px;border-radius:6px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);flex-shrink:0}
@media(max-width:600px){.card-img{width:70px;height:70px}}
@media(max-width:360px){.card-img{width:60px;height:60px}}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-code{font-size:9px;color:var(--text3);font-family:monospace;letter-spacing:1px}
@media(max-width:600px){.card-code{font-size:8px}}
.card-name{font-size:10px;color:var(--text2);text-align:center;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.card.tenho .card-name{color:#90ee90}
.card-check{margin-top:auto;font-size:15px;color:var(--border)}
.card.tenho .card-check{color:#4CAF50}
.foil-badge{position:absolute;top:3px;right:4px;font-size:8px;color:var(--gold);font-weight:700;letter-spacing:1px}
.troca-btn{position:absolute;bottom:3px;left:3px;font-size:8px;color:#fff;border:1px solid #5da3f5;border-radius:3px;padding:1px 3px;background:#5da3f5}
.troca-btn.active{color:#fff;border-color:#ff6b6b;background:#ff6b6b}
.light .troca-btn{color:#fff;border-color:#5da3f5;background:#5da3f5}
.light .troca-btn.active{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.header{background:var(--bg4);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:100;padding:10px 14px 0;transition:background .25s}
.header-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.search-row{display:flex;gap:6px;margin-bottom:8px}
.search-bar{background:var(--bg3);border-radius:8px;display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);flex:1;transition:background .25s}
.search-bar input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;flex:1;min-width:0}
.btn-search{background:var(--gold);color:#000;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex-shrink:0;background:var(--bg3);color:var(--text3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:10px;cursor:pointer;white-space:nowrap;transition:background .2s}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.stats{background:var(--bg2);border-bottom:1px solid var(--border2);padding:10px 16px;transition:background .25s}
.progress-bar{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin:6px 0 8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#1a6b1a,#4CAF50);transition:width 0.4s}
.stat-nums{display:flex;gap:16px;justify-content:flex-end;padding-right:8px}
.stat-num{text-align:center}
.stat-val{font-size:15px;font-weight:700}
.stat-lbl{font-size:9px;color:var(--text3);margin-top:1px}
.content{flex:1;padding:8px 8px 72px;overflow-y:auto}
.result-count{font-size:11px;color:var(--text3);margin-bottom:8px}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg4);border-top:1px solid var(--border2);display:flex;z-index:200;overflow-x:auto;-webkit-overflow-scrolling:touch;transition:background .25s}
.nav-btn{flex-shrink:0;flex:1;min-width:52px;background:none;border:none;border-top:2px solid transparent;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn.active{border-top-color:var(--gold)}
.nav-icon{font-size:16px}
.nav-label{font-size:9px;color:var(--text3)}
.nav-btn.active .nav-label{color:var(--gold);font-weight:700}
.nav-count{font-size:10px;color:var(--text4)}
.nav-btn.active .nav-count{color:var(--gold)}
.nav-btn.active[data-key="troca"] .nav-icon{color:var(--green)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.theme-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:4px;margin-left:8px;line-height:1}
.ranking-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:background .25s}
.ranking-bar{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin-top:6px}
.ranking-fill{height:100%;background:linear-gradient(90deg,#1a6b1a,#4CAF50);transition:width .4s}
.ranking-fill.complete{background:var(--green)}
.rank-badge{font-size:15px;min-width:28px;text-align:center}
.theme-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:4px;margin-left:4px;line-height:1}
.ranking-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:background .25s}
.ranking-bar{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden;margin-top:6px}
.ranking-fill{height:100%;background:linear-gradient(90deg,#1a6b1a,#4CAF50);transition:width .4s}
.ranking-fill.complete{background:var(--green)}
.rank-badge{font-size:14px;min-width:26px;text-align:center;flex-shrink:0}

.light .card{border-color:var(--border)}
.light .foil-badge{color:var(--gold)}
.light .troca-btn.active{background:#fff8e1}
</style>
</head>

// ── IndexedDB ──────────────────────────────────────────────────────────────
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open("PaniniWC2026", 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore("album", {keyPath:"id"});
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = e => rej(e.target.error);
  });
}
async function loadState() {
  try {
    const db = await openDB();
    return new Promise(res => {
      const req = db.transaction("album","readonly").objectStore("album").getAll();
      req.onsuccess = () => {
        const m = {};
        for (const r of req.result) m[r.id] = r;
        res(m);
      };
      req.onerror = () => res({});
    });
  } catch { return {}; }
}
async function saveItem(id, tenho, troca) {
  try {
    const db = await openDB();
    db.transaction("album","readwrite").objectStore("album").put({id,tenho,troca});
  } catch(e) { console.error(e); }
}

function getFiltered() {
  let list = ALBUM_DATA;
  if (state.tab === "tenho") list = list.filter(s => state.album[s.id]?.tenho);
  if (state.tab === "preciso") list = list.filter(s => !state.album[s.id]?.tenho);
  if (state.tab === "troca") {
    if (state.tradeMode) {
      list = list.filter(s => !state.album[s.id]?.tenho);
    } else {
      list = list.filter(s => state.album[s.id]?.troca);
    }
  }
  if (state.tab === "num1") list = list.filter(s => s.num === 1);
  if (state.tab === "num13") list = list.filter(s => s.num === 13);
  if (state.tab === "ranking") return [];
  if (state.group !== "Todos") list = list.filter(s => s.group === state.group);
  const q = state.search.trim().toLowerCase();
  if (q) list = list.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.code.toLowerCase().includes(q) ||
    s.section.toLowerCase().includes(q) ||
    s.sc.toLowerCase().includes(q)
  );
  return list;
}

function getTenho() { return Object.values(state.album).filter(v=>v.tenho).length; }
function getTroca() { return Object.values(state.album).filter(v=>v.troca).length;  }

// ── Actions ────────────────────────────────────────────────────────────────
function toggleSticker(id) {
  const cur = state.album[id] || {id,tenho:false,troca:false};
  const next = {...cur, tenho:!cur.tenho, troca: cur.tenho ? false : cur.troca};
  state.album[id] = next;
  saveItem(id, next.tenho, next.troca);
  render();
}
function toggleTroca(id) {
  const cur = state.album[id] || {id,tenho:false,troca:false};
  const next = {...cur, troca:!cur.troca};
  state.album[id] = next;
  saveItem(id, next.tenho, next.troca);
  render();
}
function toggleTradeSelection(id) {
  if (state.selectedTrade.has(id)) {
    state.selectedTrade.delete(id);
  } else {
    state.selectedTrade.add(id);
  }
  render();
}
function clearTradeSelection() {
  state.selectedTrade.clear();
  render();
}
function confirmTrade() {
  if (state.selectedTrade.size === 0) {
    alert("Selecione pelo menos uma figurinha!");
    return;
  }
  state.selectedTrade.forEach(id => {
    const cur = state.album[id] || {id,tenho:false,troca:false};
    const next = {...cur, tenho:true, troca:false};
    state.album[id] = next;
    saveItem(id, next.tenho, next.troca);
  });
  state.selectedTrade.clear();
  state.tradeMode = false;
  render();
}
function startTradeMode() {
  state.tradeMode = true;
  state.selectedTrade.clear();
  render();
}
function setTab(tab) { 
  state.tab = tab;
  if (tab === "troca") {
    startTradeMode();
  } else {
    state.tradeMode = false;
    state.selectedTrade.clear();
  }
  render();
}
function setSearch(v) { state.search = v; state.pendingSearch = v; render(); }
function doSearch() { state.search = state.pendingSearch; render(); }
function setGroup(g) { state.group = g; render(); }
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  render();
}
function renderRankingHtml() {
  const countries = {};
  for (const s of ALBUM_DATA) {
    if (!countries[s.sc]) countries[s.sc] = {sc:s.sc,name:COUNTRY_NAME[s.sc]||s.sc,flag:FLAG_MAP[s.sc]||'⚽',total:0,tenho:0,group:s.group};
    countries[s.sc].total++;
    if (state.album[s.id]?.tenho) countries[s.sc].tenho++;
  }
  const sorted = Object.values(countries).sort((a,b)=>(b.tenho/b.total)-(a.tenho/a.total));
  const complete = sorted.filter(c=>c.tenho===c.total&&c.total>0).length;
  let out = '<div style="font-size:11px;color:var(--text3);margin-bottom:10px;text-align:center">' + complete + ' seleção(ões) completa(s) · ' + sorted.length + ' seleções</div>';
  out += sorted.map((c,i)=>{
    const pct = c.total>0?Math.round(c.tenho/c.total*100):0;
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'<span style="font-size:11px;color:var(--text3)">'+(i+1)+'º</span>';
    return '<div class="ranking-item">' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<div class="rank-badge">' + medal + '</div>' +
        '<div style="font-size:16px">' + c.flag + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:12px;font-weight:700;color:var(--text)">' + c.name + '</div>' +
          '<div style="font-size:9px;color:var(--text3)">' + c.group + '</div>' +
        '</div>' +
        '<div style="text-align:right;flex-shrink:0">' +
          '<div style="font-size:13px;font-weight:700;color:' + (pct===100?'var(--green)':'var(--text)') + '">' + pct + '%</div>' +
          '<div style="font-size:9px;color:var(--text3)">' + c.tenho + '/' + c.total + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ranking-bar"><div class="ranking-fill' + (pct===100?' complete':'') + '" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }).join('');
  return out;
}

// ── Boot ───────────────────────────────────────────────────────────────────
if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
loadState().then(album => {
  state.album = album;
  render();
});
</script>
</body>
</html>
